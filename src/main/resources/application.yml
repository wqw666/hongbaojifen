# ==========================================
# 红包积分管理 — 基础配置
# 默认 local；生产用 --spring.profiles.active=prod
# ==========================================
server:
  port: 8892
  tomcat:
    uri-encoding: UTF-8
    relaxed-query-chars: '|,{,},[,],^,",<,>'

spring:
  # 手动执行过迁移 SQL 的库（非空但无历史表）也能正常启动：baseline 到版本1
  # 前提：手动执行的 SQL 必须与迁移文件一致；V1 之后的迁移仍会正常执行
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  # 玩法文件上传上限（与 PlayRuleService 20MB 校验一致；默认 1MB 会提前拒绝）
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: jdbc:mysql://localhost:3306/hongbaojifen?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&sessionVariables=sql_mode='ANSI_QUOTES'
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 19991020

app:
  jwt:
    secret: hbjf_dev_secret_2026
    expire-hours: 24
  # 对外开放接口密钥（agent 调用时放在请求头 X-Api-Key）
  open:
    api-key: hbjf-open-2026
  # 玩法规则文件存储目录
  rules-dir: ./data/rules
