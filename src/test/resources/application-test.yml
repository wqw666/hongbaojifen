spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  flyway:
    enabled: false

app:
  jwt:
    secret: hbjf_test_secret
    expire-hours: 24
  open:
    api-key: test-open-key
  rules-dir: ./target/test-rules
